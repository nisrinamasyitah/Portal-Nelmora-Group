# Netlify settings for portal.nelmoragroup.com
# The website (client/) is built into client/dist; the API runs as one function (netlify/functions/api.mjs)
# and keeps the database in Netlify Blobs.

[build]
  command = "npm install --prefix client && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Copied as-is instead of bundled (better-sqlite3 has a compiled part built for Netlify's servers).
  external_node_modules = ["better-sqlite3", "express"]
  # better-sqlite3 is loaded in a way the packager can't follow, so include its folder explicitly
  # (it contains the ready-made SQLite engine for Linux in prebuilds/).
  included_files = ["node_modules/better-sqlite3/**"]

# API calls (/api/*) go to the function; its path is set inside netlify/functions/api.mjs.

# Every other page loads the app (Stock, Sales, ... are handled in the browser)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Local test of the Netlify setup: netlify dev
[dev]
  framework = "#custom"
  command = "npm run dev --prefix client"
  targetPort = 5173
  port = 8888
