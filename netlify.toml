# Netlify settings for portal.nelmoragroup.com
# The website (client/) is built into client/dist; the API runs as one function (netlify/functions/api.mjs)
# and keeps the database in Netlify Blobs.

[build]
  command = "npm install --prefix client && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Copied as-is instead of bundled (better-sqlite3 has a compiled part built for Netlify's servers).
  external_node_modules = ["better-sqlite3", "express"]
  # better-sqlite3 is loaded in a way the packager can't follow, so include its folder explicitly
  # (it contains the ready-made SQLite engine for Linux in prebuilds/).
  included_files = ["node_modules/better-sqlite3/**"]

# API calls (/api/*) go to the function; its path is set inside netlify/functions/api.mjs.

# Every other page loads the app (Stock, Sales, ... are handled in the browser)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    # Only this site's own code may run; fonts come from Google Fonts. Nobody can put the portal inside their site.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Private business portal: keep it out of Google and other search engines.
    X-Robots-Tag = "noindex, nofollow"

# Local test of the Netlify setup: netlify dev
[dev]
  framework = "#custom"
  command = "npm run dev --prefix client"
  targetPort = 5173
  port = 8888
